<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🪞 Зазеркалье</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui;background:#1a0d2c;color:#fff;overflow-x:hidden}main{max-width:1000px;margin:auto;padding:36px 20px 140px;position:relative;z-index:1}h1{font-size:clamp(3rem,10vw,6rem);margin:10px 0;background:linear-gradient(90deg,#ffcaff,#a7eaff,#ffcaff);color:transparent;background-clip:text}p{line-height:1.7}.glass{border:1px solid #ffffff40;border-radius:25px;padding:25px;background:#ffffff11;backdrop-filter:blur(20px);box-shadow:0 20px 55px #0006}.mirror{min-height:55vh;border:12px ridge #aa80d8;border-radius:50% 50% 24% 24%;margin:45px auto 10px;max-width:680px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#ae83e34d,#26193a 75%);box-shadow:inset 0 0 65px #e9d2ff78,0 0 70px #ae83e359}.mirror:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ffffff1a 36%,transparent 48%);animation:shine 8s linear infinite}@keyframes shine{50%{transform:translateX(30%)}}.photo{position:absolute;max-width:42%;max-height:52%;object-fit:cover;opacity:.3;filter:blur(1px) saturate(.8);border:2px solid #fff8;border-radius:16px;box-shadow:0 0 30px #ffffff42;animation:appear 7s ease-in-out infinite alternate}@keyframes appear{0%{opacity:.08;transform:translateY(15px) rotate(-6deg)}100%{opacity:.42;transform:translateY(-18px) rotate(5deg)}}.empty{height:100%;min-height:48vh;display:grid;place-items:center;text-align:center;color:#eedbff;padding:24px}.orb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(30px);opacity:.26;animation:drift 11s ease-in-out infinite alternate}.one{height:240px;width:240px;left:0;top:22%;background:#9d62d9}.two{height:350px;width:350px;right:0;bottom:0;background:#63bce3;animation-delay:-5s}@keyframes drift{to{transform:translate(35px,-75px)}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}</style></head><body data-theme="purple"><div class="orb one"></div><div class="orb two"></div><main><div class="glass"><small>🪞 SECRET MIRROR WORLD</small><h1>Зазеркалье</h1><p>Между отражениями скоро появятся полупрозрачные фотографии, будто воспоминания из другого мира.</p><div class="mirror" id="mirror"><div class="empty" id="empty">✨ Зеркало ждёт фотографии…</div></div><p>Фотографии появятся после добавления. Основной сайт, квесты и кошачья комната остаются доступны.</p><a href="index.html">← Вернуться на праздник</a></div></main><script src="theme-icons.js"></script><script>const photos=[];const surface=document.querySelector('#mirror');if(photos.length){document.querySelector('#empty').remove();photos.forEach((src,i)=>{const img=document.createElement('img');img.className='photo';img.src=src;img.alt='Воспоминание '+(i+1);img.style.left=(8+(i*29)%53)+'%';img.style.top=(7+(i*19)%42)+'%';img.style.animationDelay=(-i*1.7)+'s';surface.append(img)})}</script></body></html>
