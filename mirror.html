<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🪞 Зазеркалье — воспоминания</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 12%,#4f326e,#170e2a 70%,#0e0a1b);color:#fff;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:30px 16px 110px}header{text-align:center}h1{font-size:clamp(2.8rem,9vw,5.2rem);margin:10px;color:#f5ddff;text-shadow:0 0 35px #c394ffa6}p{line-height:1.55}header p{color:#ead9f7}.back{display:inline-block;color:#fff;text-decoration:none;margin:14px;padding:12px 20px;border-radius:15px;border:1px solid #fff6;background:#ffffff19;backdrop-filter:blur(12px)}.mirror{isolation:isolate;position:relative;overflow:hidden;margin:18px auto;min-height:min(80vh,760px);border:10px ridge #b9a0d1;border-radius:43% 43% 16% 16% / 15% 15% 7% 7%;background:radial-gradient(ellipse at 50% 40%,#9c8ec32d,#24143b 80%);box-shadow:0 0 75px #d19dff57,inset 0 0 90px #cdb8f943}.mirror:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(112deg,transparent 25%,#ffffff13 40%,transparent 55%);animation:glint 12s ease-in-out infinite}.memory{position:absolute;width:clamp(115px,27vw,275px);height:auto;max-height:50%;object-fit:cover;opacity:0;z-index:2;border:2px solid #ffffffa3;border-radius:18px;box-shadow:0 0 24px #c7a8ef77;animation:ghost 15s ease-in-out infinite;filter:saturate(.88) brightness(1.08)}.memory:nth-of-type(1){left:8%;top:9%;animation-delay:-1s}.memory:nth-of-type(2){right:8%;top:12%;animation-delay:-9s}.memory:nth-of-type(3){left:33%;top:36%;animation-delay:-5s}.memory:nth-of-type(4){left:7%;bottom:5%;animation-delay:-12s}.memory:nth-of-type(5){right:6%;bottom:7%;animation-delay:-7s}@keyframes ghost{0%,100%{opacity:0;transform:translate(-12px,18px) rotate(-5deg) scale(.94)}35%,65%{opacity:.38;transform:translate(12px,-18px) rotate(3deg) scale(1.02)}}.fog{position:absolute;inset:-25%;z-index:5;pointer-events:none;mix-blend-mode:screen;filter:blur(27px);background:radial-gradient(ellipse at 30% 70%,#e6d7ee6b,transparent 50%),radial-gradient(ellipse at 77% 28%,#c3e3ef65,transparent 55%);animation:mist 23s ease-in-out infinite alternate}.fog.two{z-index:6;opacity:.7;filter:blur(55px);animation-direction:alternate-reverse;animation-duration:34s}.caption{position:absolute;z-index:7;bottom:3%;left:6%;right:6%;text-align:center;font-style:italic;color:#f6eaff;text-shadow:0 2px 9px #000}.stars{position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:60px 65px;animation:starfall 45s linear infinite}@keyframes mist{from{transform:translate(-12%,8%) scale(1.05)}to{transform:translate(15%,-7%) scale(1.25)}}@keyframes glint{50%{transform:translateX(45%)}}@keyframes starfall{to{background-position:120px 130px}}@media(max-width:600px){.mirror{min-height:68vh;border-width:7px;border-radius:32% 32% 12% 12%/10% 10% 5% 5%}.memory{width:43%}.memory:nth-of-type(3){left:29%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.memory{opacity:.36!important}}</style><style>
/* Mirror 2.0: mobile layout and interactive memories */
.mirror{max-width:850px;min-height:650px;transition:box-shadow .3s}
.memory{cursor:pointer;pointer-events:auto;transition:filter .25s,box-shadow .25s}
.memory:focus-visible{outline:3px solid #fff;outline-offset:5px}
.mirror-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin:16px auto 10px;max-width:650px}
.mirror-controls button{border:1px solid #f5d4ff8c;background:#ffffff18;color:#fff;border-radius:12px;padding:11px 15px;min-height:44px;font:600 14px system-ui;cursor:pointer;backdrop-filter:blur(12px)}
.mirror-controls button:hover{background:#ffffff36}
.fog.mist-off{display:none}
.mirror-viewer{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;background:#10091de8;backdrop-filter:blur(18px);padding:65px 15px 30px}
.mirror-viewer.open{display:flex}
.mirror-viewer img{max-width:100%;max-height:72dvh;object-fit:contain;border:5px solid #f7e9ff;border-radius:15px;box-shadow:0 0 45px #d9b4ff7d}
.mirror-viewer button{background:#fff;color:#22112d;border:0;border-radius:12px;padding:10px 15px;font:700 17px system-ui;cursor:pointer}
.mirror-viewer .close-view{position:absolute;top:18px;right:18px;font-size:25px}
.mirror-viewer .viewer-actions{display:flex;gap:14px}
@media(max-width:650px){
 main{padding:16px 10px 90px}
 header h1{font-size:clamp(34px,10vw,54px)}
 .mirror{width:100%;min-height:590px;border-width:7px;border-radius:32% 32% 12% 12%/12% 12% 5% 5%}
 .memory{width:44%;max-height:40%;object-fit:cover}
 .memory:nth-of-type(1){left:5%;top:11%}
 .memory:nth-of-type(2){right:4%;top:17%}
 .memory:nth-of-type(3){left:27%;top:39%;z-index:3}
 .memory:nth-of-type(4){left:5%;bottom:6%}
 .memory:nth-of-type(5){right:4%;bottom:10%}
 .caption{font-size:13px;bottom:1%;line-height:1.4}
 .fog{filter:blur(38px);opacity:.7}
}
@media(max-width:380px){.mirror{min-height:530px}.memory{width:45%}}
</style></head><body data-theme="purple"><div class="stars"></div><main><header><small>✨ MEMORY ARCHIVE ✨</small><h1>🪞 Зазеркалье</h1><p>Среди волшебного тумана оживают самые дорогие воспоминания.</p><a class="back" href="index.html">← На праздник</a></header><div class="mirror-controls"><button id="mistToggle" type="button" aria-pressed="true">🌫️ Туман: включён</button><button id="memoryRandom" type="button">✨ Случайное воспоминание</button></div><section class="mirror" aria-label="Полупрозрачные воспоминания"><img class="memory" src="assets/DSC04380%20(2).JPG" loading="eager" alt="Фотография-воспоминание 1"><img class="memory" src="assets/IMG_20261011_230323_836.jpg" loading="eager" alt="Фотография-воспоминание 2"><img class="memory" src="assets/IMG_20261011_230323_862.jpg" loading="lazy" alt="Фотография-воспоминание 3"><img class="memory" src="assets/IMG_20261011_230323_877.jpg" loading="lazy" alt="Фотография-воспоминание 4"><img class="memory" src="assets/IMG_20261011_230323_945.jpg" loading="lazy" alt="Фотография-воспоминание 5"><div class="fog"></div><div class="fog two"></div><div class="caption">Некоторые моменты остаются с нами навсегда… 💜</div></section></main><div class="mirror-viewer" id="mirrorViewer" role="dialog" aria-modal="true" aria-label="Просмотр воспоминания"><button type="button" class="close-view" id="closeMemory" aria-label="Закрыть">×</button><img id="fullMemory" alt="Выбранное воспоминание"><div class="viewer-actions"><button type="button" id="prevMemory">←</button><button type="button" id="nextMemory">→</button></div><p id="memoryLabel"></p></div><script>(function(){const photos=[...document.querySelectorAll('.mirror .memory')],viewer=document.getElementById('mirrorViewer'),full=document.getElementById('fullMemory'),label=document.getElementById('memoryLabel');let current=0;function open(i){current=(i+photos.length)%photos.length;full.src=photos[current].src;full.alt=photos[current].alt;label.textContent='Воспоминание '+(current+1)+' / '+photos.length;viewer.classList.add('open');document.body.style.overflow='hidden'}function close(){viewer.classList.remove('open');document.body.style.overflow=''}photos.forEach((img,i)=>{img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','Открыть воспоминание '+(i+1));img.addEventListener('click',()=>open(i));img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i)}})});document.getElementById('closeMemory').onclick=close;document.getElementById('prevMemory').onclick=()=>open(current-1);document.getElementById('nextMemory').onclick=()=>open(current+1);document.getElementById('memoryRandom').onclick=()=>open(Math.floor(Math.random()*photos.length));document.getElementById('mistToggle').onclick=e=>{const fogs=document.querySelectorAll('.fog');const off=fogs[0].classList.toggle('mist-off');fogs[1].classList.toggle('mist-off',off);e.currentTarget.textContent=off?'🌫️ Туман: выключен':'🌫️ Туман: включён';e.currentTarget.setAttribute('aria-pressed',String(!off))};viewer.addEventListener('click',e=>{if(e.target===viewer)close()});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')open(current-1);if(e.key==='ArrowRight')open(current+1)})})()</script><script src="theme-icons.js"></script><script src="visit-tracker.js"></script></body></html>
