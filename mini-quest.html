<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Лисья мини-игра</title><link rel="stylesheet" href="style.css"></head><body data-theme="fox"><main class="section questStandalone"><a class="ghost" href="index.html">← На праздник</a><div class="sectionHead"><span>STEP 1 / MINI GAME</span><h2>Код лисьей норы 🦊</h2><p>Собери три цифры: число кошачьих жизней по поговорке, количество букв в слове «лиса» и число хвостов у обычной лисы.</p></div><div class="foxDen"><div class="foxHero">🦊</div><div><div class="codeRow"><input id="code" maxlength="3" inputmode="numeric" placeholder="???"><button class="primary" id="check">Проверить</button></div><div id="result" class="questResult"></div></div></div></main><script>check.onclick=()=>{if(code.value.trim()==='941'){localStorage.setItem('fox-minigame-complete','yes');result.innerHTML='<div class="unlockCard"><b>🏆 Мини-игра пройдена!</b><span>Теперь открыт следующий лисий квест.</span><a class="adventureBtn primary" href="small-quest.html">Перейти к маленькому квесту 🧩 →</a></div>'}else result.textContent='🦊 Лисёнок качает головой. Попробуй ещё раз!'}</script></body></html>
