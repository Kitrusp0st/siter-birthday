<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Маленький лисий квест</title><link rel="stylesheet" href="style.css"></head><body data-theme="fox"><main class="section questStandalone"><div id="locked"></div><div id="game" hidden><a class="ghost" href="index.html">← На праздник</a><div class="sectionHead"><span>STEP 2 / FOX PUZZLE</span><h2>Следы Янтарного Лиса 🐾</h2><p>Лисёнок оставил цепочку следов. Ответь на три загадки, чтобы найти дверь в следующий мир.</p></div><div class="puzzleCard"><h3>1. Что бросают в D&D, чтобы испытать удачу?</h3><button class="choiceBtn" data-ok="1">🎲 d20</button><button class="choiceBtn">🪙 Монетку</button></div><div class="puzzleCard"><h3>2. Какой город охраняют разводные мосты и Нева?</h3><button class="choiceBtn">Москва</button><button class="choiceBtn" data-ok="1">Санкт-Петербург</button></div><div class="puzzleCard"><h3>3. Кто оставил рыжие следы?</h3><button class="choiceBtn" data-ok="1">🦊 Лиса</button><button class="choiceBtn">🐉 Дракон</button></div><div id="finish"></div></div></main><script>const game=document.querySelector('#game'),locked=document.querySelector('#locked');if(localStorage.getItem('fox-minigame-complete')!=='yes'){locked.innerHTML='<div class="unlockCard"><b>🔒 Сначала пройди мини-игру</b><a class="adventureBtn primary" href="mini-quest.html">К мини-игре →</a></div>'}else{game.hidden=false;let n=0;document.querySelectorAll('.choiceBtn').forEach(b=>b.onclick=()=>{if(b.dataset.ok&&!b.classList.contains('done')){b.classList.add('done');b.textContent='✓ '+b.textContent;n++;if(n===3){localStorage.setItem('fox-small-complete','yes');finish.innerHTML='<div class="unlockCard"><b>✨ Маленький квест пройден!</b><span>Теперь выбирай, куда идти дальше.</span><div class="finishChoices"><a class="adventureBtn ghost" href="index.html">← Вернуться на праздник</a><a class="adventureBtn primary" href="quest.html">Большой D&D-квест 🎲 →</a></div></div>'}}else if(!b.dataset.ok)b.textContent='Попробуй ещё 🦊'})}</script></body></html>
